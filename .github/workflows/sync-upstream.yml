name: 同步上游代码

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'yuangy1995/hongguo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 同步 main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
